<form (ngSubmit)="onSubmit()">
    <div>
        <label for="flight-from">
            Flight from:
        </label>
        <select name="flight-from" id="flight-from" [(ngModel)]="travelFormModel.fromCountry">
            @for (country of this.countries; track country) {
            <option value="{{country}}">{{country}}</option>
            }

        </select>
    </div>
    <div>
        <label for="flight-to">
            Flight to:
        </label>
        <select name="flight-to" id="flight-to" [(ngModel)]="travelFormModel.toCountry">
            @for (country of this.countries; track country) {
            <option value="{{country}}">{{country}}</option>
            }

        </select>
    </div>
    <button type="submit" [disabled]="true">Find flights</button>
</form>
