<form #travelForm="ngForm" (ngSubmit)="onSubmit(travelForm)">
    <div>
        <label for="flight-from">
            Flight from:
        </label>
        <select name="flight-from" id="flight-from" [(ngModel)]="travelFormModel.fromCountry" required>
            @for (country of this.countries; track country) {
            <option value="{{country}}">{{country}}</option>
            }

        </select>
    </div>
    <div>
        <label for="flight-to">
            Flight to:
        </label>
        <select name="flight-to" id="flight-to" [(ngModel)]="travelFormModel.toCountry" required>
            @for (country of this.countries; track country) {
            <option value="{{country}}">{{country}}</option>
            }

        </select>
    </div>
    <button type="submit">Find flights</button>
</form>
